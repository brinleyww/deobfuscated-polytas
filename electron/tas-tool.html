<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>TAS Tool</title>
    <link rel="stylesheet" href="tas-tool.css">
</head>

<body>
    <header>
        <h1 style="margin:0;font-weight:600;font-size:16px">TAS Tool</h1>
    </header>
    <main>
        <div class="ghosts">
            <h2>Ghosts</h2>
            <div class="row" style="gap:6px">
                <button id="gh-show-all">Show all</button>
                <button id="gh-hide-all">Hide all</button>
            </div>
            <div id="ghosts" class="ghosts-list"></div>
        </div>


        <div class="section-decoded">
            <label>Decoded (human-readable)</label>
            <div class="findbar" id="findbar" style="display:none;gap:8px;align-items:center;margin:4px 0">
                <input id="find" placeholder="Find..." style="width:100%;background:#0f0f17;color:#eee;border:1px solid #2a2a3a;border-radius:6px;padding:6px 10px;font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;font-size:12px;">
                <span id="find-count" style="font-size:12px;color:#bbb;margin:0 4px"></span>
                <button id="find-prev">Prev</button>
                <button id="find-next">Next</button>
                <button id="find-close">Close</button>
            </div>
            <textarea id="decoded" spellcheck="false" class="decoded-editor" placeholder="Decoded ghost input"></textarea>
            <div id="decoded-overlay" class="decoded-overlay"></div>
            <div class="decoded-scroll">
                <button id="decoded-scroll-up" title="Scroll to top">▲</button>
                <button id="decoded-scroll-down" title="Scroll to bottom">▼</button>
            </div>
        </div>

        <div id="command-row" style="display: flex; gap: 8px; align-items: center;">
            <input id="command" placeholder="e.g., tap 1150 1205 wd 10 5  OR  hold wd for 120 at 2000" style="background: #0f0f17; color: #eee; border: 1px solid #2a2a3a; border-radius: 6px; padding: 8px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: 12px;">
            <button id="execute" style="flex-shrink: 0;">Execute Command</button>
        </div>

        <div class="section-controls">
            <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
                <input id="offset-ms" type="number" placeholder="Offset selected (ms)" style="width:160px;background:#0f0f17;color:#eee;border:1px solid #2a2a3a;border-radius:6px;padding:8px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;font-size:12px;">
                <button id="offset-apply">Apply Offset</button>
            </div>

            <div style="display:flex;gap:8px">
                <button id="bookmarks-open">Bookmarks</button>
                <button id="save-file">Save to File</button>
                <button id="load-file">Load from File</button>
                <button id="copy">Copy</button>
                <button id="clear">Clear</button>
                <button id="apply">Apply</button>
            </div>
        </div>
    </main>

    <div id="palette-overlay" class="palette-overlay">
        <div class="palette">
            <input id="palette-input" class="palette-input" placeholder="Type a command: tap, hold, frame #, label...">
            <div id="palette-list" class="palette-list"></div>
        </div>
    </div>

    <div id="bookmarks-overlay" class="palette-overlay">
        <div class="palette">
            <div style="display:flex;gap:8px;align-items:center;border-bottom:1px solid #2a2a3a">
                <input id="bookmarks-filter" class="palette-input" placeholder="Filter labels...">
                <button id="bookmark-add-current" title="Add label at caret (Ctrl+Shift+B)">Add at caret</button>
                <button id="bookmark-add-by-frame" title="Add label at frame">Add at frame</button>
            </div>
            <div id="bookmarks-list" class="palette-list"></div>
        </div>
    </div>

    <script>
        var $ = function(id) {
            return document.getElementById(id);
        };
        var setVal = function(v) {
            var el = $("encoded");
            if (el) el.value = v || "";
        };

        // Simplified editor state helpers (no syntax highlighting)
        var setHuman = function(v) {
            var d = $("decoded");
            if (d) {
                d.value = v || "";
                d.textContent = v || "";
            }
        };

        function renderGhosts(data) {
            try {
                var root = $("ghosts");
                if (!root) return;
                root.textContent = "";
                if (!data || !Array.isArray(data.names)) return;
                var names = data.names || [];
                var sel = typeof data.selected === "number" ? data.selected : -1;
                var vis = Array.isArray(data.visibility) ? data.visibility.map(v => v !== false) : names.map(() => true);
                var colors = Array.isArray(data.colors) ? data.colors : null;
                var colors2 = Array.isArray(data.secondaryColors) ? data.secondaryColors : null;
                names.forEach(function(name, idx) {
                    var row = document.createElement('div');
                    row.className = 'ghost-item';
                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = !!vis[idx];
                    cb.disabled = (idx === sel);
                    cb.addEventListener('change', function() {
                        vis[idx] = cb.checked;
                        try {
                            window.electron.tasToolSetVisibility(vis);
                        } catch (e) {}
                    });
                    var colorDot = document.createElement('span');
                    colorDot.className = 'ghost-color';
                    try {
                        var c1 = colors && colors[idx] && typeof colors[idx] === 'string' ? colors[idx] : null;
                        var c2 = colors2 && colors2[idx] && typeof colors2[idx] === 'string' ? colors2[idx] : null;
                        if (c1 && c2) {
                            colorDot.style.background = 'linear-gradient(90deg, ' + c1 + ' 50%, ' + c2 + ' 50%)';
                        } else if (c1) {
                            colorDot.style.background = c1;
                        } else if (c2) {
                            colorDot.style.background = c2;
                        }
                    } catch (e) {}
                    var lab = document.createElement('span');
                    lab.className = 'ghost-name';
                    lab.textContent = (idx === sel ? '[TAS] ' : '') + name;
                    var btn = document.createElement('button');
                    btn.textContent = 'Load';
                    btn.title = 'Load this ghost into editor';
                    btn.addEventListener('click', function() {
                        try {
                            window.electron.tasToolRequestLoad(idx);
                        } catch (e) {}
                    });
                    row.appendChild(cb);
                    row.appendChild(colorDot);
                    row.appendChild(lab);
                    row.appendChild(btn);
                    root.appendChild(row);
                });
                var sh = $("gh-show-all"),
                    hd = $("gh-hide-all");
                if (sh) sh.onclick = function() {
                    for (var i = 0; i < vis.length; i++) {
                        vis[i] = true
                    }
                    try {
                        window.electron.tasToolSetVisibility(vis)
                    } catch (e) {}
                };
                if (hd) hd.onclick = function() {
                    for (var i = 0; i < vis.length; i++) {
                        if (i !== sel) vis[i] = false
                    }
                    try {
                        window.electron.tasToolSetVisibility(vis)
                    } catch (e) {}
                };
            } catch (e) {}
        }

        window.addEventListener("DOMContentLoaded", function() {
            setVal(window.__tasEncoded || "");
            setHuman(window.__tasDecoded || "");
            window.electron.onTasToolGhostsUpdate(function(payload) {
                try {
                    renderGhosts(payload)
                } catch (e) {}
            });
            if (window.__tasGhosts) {
                try {
                    renderGhosts(window.__tasGhosts)
                } catch (e) {}
            }

            $("copy").onclick = function() {
                var t = $("decoded").value;
                if (window.navigator && navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(t).catch(function() {});
                } else {
                    try {
                        var temp = document.createElement('textarea');
                        temp.value = t;
                        document.body.appendChild(temp);
                        temp.select();
                        document.execCommand("copy");
                        document.body.removeChild(temp);
                    } catch (e) {}
                }
            };
            $("clear").onclick = function() {
                setVal("");
                setHuman("");
            };
            $("apply").onclick = function() {
                try {
                    var ta = $("decoded");
                    var fullText = ta.value || "";
                    var lines = fullText.split("\n");
                    var commands = [];
                    var baseLines = [];

                    function hasGeneratedBlock(linesArr, idx, cmd) {
                        var begin = '# BEGIN generated: ' + cmd;
                        var end = '# END generated: ' + cmd;
                        if (linesArr[idx + 1] && linesArr[idx + 1].trim() === begin) {
                            for (var k = idx + 2; k < linesArr.length; k++) {
                                if ((linesArr[k] || '').trim() === end) return true;
                            }
                        }
                        return false;
                    }
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i];
                        var hashIdx = line.indexOf('#');
                        var codePart = (hashIdx >= 0 ? line.slice(0, hashIdx) : line).trim();
                        if (/^(tap|hold)\s+/i.test(codePart)) {
                            var skip = hasGeneratedBlock(lines, i, codePart);
                            if (!skip) commands.push({
                                lineIndex: i,
                                text: codePart
                            });
                        } else if (codePart.length) {
                            baseLines.push(codePart);
                        }
                    }

                    function toEntries(map) {
                        return Array.from(map.entries()).map(function(e) {
                            return {
                                frame: e[0],
                                keys: e[1]
                            };
                        }).sort(function(a, b) {
                            return a.frame - b.frame;
                        });
                    }

                    function normalizeKeys(str) {
                        var order = ["w", "a", "s", "d", "r"];
                        var set = new Set();
                        for (var k of String(str || ""))
                            if (order.indexOf(k) >= 0) set.add(k);
                        return order.filter(function(k) {
                            return set.has(k);
                        }).join("");
                    }

                    function parseLines(text) {
                        return (text || "").split("\n").map(function(line) {
                                var idx = line.indexOf("#");
                                return idx >= 0 ? line.slice(0, idx) : line;
                            })
                            .filter(function(line) {
                                return line.trim() !== "";
                            })
                            .map(function(line) {
                                var parts = line.split(",");
                                var frame = parseInt(parts[0], 10);
                                var keys = (parts.slice(1).join(",") || "").trim();
                                return {
                                    frame: frame,
                                    keys: normalizeKeys(keys)
                                };
                            })
                            .filter(function(e) {
                                return !isNaN(e.frame);
                            })
                            .sort(function(a, b) {
                                return a.frame - b.frame;
                            });
                    }

                    function getStateAt(entries, frame) {
                        var state = "";
                        for (var i = 0; i < entries.length; i++) {
                            if (entries[i].frame <= frame) state = entries[i].keys;
                            else break;
                        }
                        return state;
                    }

                    // Start with base map from non-command lines
                    var baseEntries = parseLines(baseLines.join("\n"));
                    var out = new Map(baseEntries.map(function(e) {
                        return [e.frame, e.keys];
                    }));

                    // Apply each command sequentially against the evolving map
                    for (var ci = 0; ci < commands.length; ci++) {
                        var cmdText = commands[ci].text;
                        if (/^hold\s+/i.test(cmdText)) {
                            var m = cmdText.match(/^hold\s+([wasd]+)\s+for\s+(\d+)\s+at\s+(\d+)$/i) || cmdText.match(/^hold\s+([wasd]+)\s+(\d+)\s+(\d+)$/i);
                            if (!m) continue;
                            var held = normalizeKeys(m[1]);
                            var dur = parseInt(m[2], 10);
                            var start = parseInt(m[3], 10);
                            if (!held || isNaN(dur) || isNaN(start) || dur <= 0) continue;
                            var end = start + dur;
                            var snapshot = toEntries(out);
                            var startBase = getStateAt(snapshot, start);
                            var startSet = new Set((startBase || "").split(""));
                            for (var ch of held) startSet.add(ch);
                            out.set(start, normalizeKeys(Array.from(startSet).join("")));
                            for (var ei = 0; ei < snapshot.length; ei++) {
                                var e = snapshot[ei];
                                if (e.frame > start && e.frame < end) {
                                    var mid = new Set((e.keys || "").split(""));
                                    for (var ch2 of held) mid.add(ch2);
                                    out.set(e.frame, normalizeKeys(Array.from(mid).join("")));
                                }
                            }
                            var endBase = getStateAt(snapshot, end);
                            out.set(end, normalizeKeys(endBase));
                        } else if (/^tap\s+/i.test(cmdText)) {
                            var parts = cmdText.split(/\s+/);
                            if (parts.length !== 6) continue;
                            var arr = parts.map(function(t, i) {
                                return (i > 0 && i !== 3) ? parseInt(t, 10) : t;
                            });
                            var r = arr[1],
                                a2 = arr[2],
                                o = arr[3],
                                s = arr[4],
                                i2 = arr[5];
                            if ([r, a2, s, i2].some(isNaN) || r >= a2 || s <= 0 || i2 <= 0) continue;
                            var snapshot = toEntries(out);
                            var lastKeys = "";
                            var lastFrame = -1;
                            for (var u = 0; u < snapshot.length; u++) {
                                var e = snapshot[u];
                                if (e.frame < r && e.frame > lastFrame) {
                                    lastKeys = e.keys;
                                    lastFrame = e.frame;
                                }
                            }
                            var p = r;
                            var seq = [];
                            while (p <= a2) {
                                seq.push([p, String(o)]);
                                p += s;
                                if (p > a2) break;
                                seq.push([p, String(lastKeys)]);
                                p += i2;
                            }
                            for (var q = 0; q < seq.length; q++) {
                                out.set(seq[q][0], normalizeKeys(seq[q][1]));
                            }
                        }
                    }

                    var finalText = Array.from(out.entries()).sort(function(a, b) {
                        return a[0] - b[0];
                    }).map(function(kv) {
                        return kv[0] + "," + kv[1];
                    }).join("\n");
                    window.electron.tasToolApply(finalText);
                } catch (e) {
                    try {
                        var t = $("decoded").value || "";
                        window.electron.tasToolApply(t);
                    } catch (e2) {}
                }
            };

            // Scroll helpers for decoded editor
            try {
                var scrollUpBtn = $("decoded-scroll-up");
                var scrollDownBtn = $("decoded-scroll-down");
                var decoded = $("decoded");
                if (scrollUpBtn && scrollDownBtn && decoded) {
                    scrollUpBtn.addEventListener('click', function() {
                        try {
                            decoded.scrollTo({
                                top: 0,
                                behavior: 'smooth'
                            });
                        } catch (e) {
                            try {
                                decoded.scrollTop = 0;
                            } catch (_) {}
                        }
                    });
                    scrollDownBtn.addEventListener('click', function() {
                        try {
                            decoded.scrollTo({
                                top: decoded.scrollHeight,
                                behavior: 'smooth'
                            });
                        } catch (e) {
                            try {
                                decoded.scrollTop = decoded.scrollHeight;
                            } catch (_) {}
                        }
                    });
                }
            } catch (e) {}

            // Save/Load
            $("save-file").onclick = async function() {
                try {
                    var t = $("decoded").value || "";
                    await window.electron.tasToolSaveToFile(t);
                } catch (e) {}
            };
            $("load-file").onclick = async function() {
                try {
                    var res = await window.electron.tasToolLoadFromFile();
                    if (res && !res.canceled && typeof res.content === "string") {
                        setHuman(res.content);
                    }
                } catch (e) {}
            };

            // ---- Command execution (shared by button and palette) ----
            const keyOrder = ["w", "a", "s", "d"];

            function normalizeKeys(str) {
                if (!str) return "";
                const set = new Set();
                for (const ch of String(str)) {
                    if (keyOrder.includes(ch)) set.add(ch);
                }
                return keyOrder.filter(k => set.has(k)).join("");
            }

            function parseLines(text) {
                return (text || "").split("\n").map(line => {
                    const idx = line.indexOf("#");
                    return idx >= 0 ? line.slice(0, idx) : line;
                }).filter(line => line.trim() !== "").map(line => {
                    const parts = line.split(",");
                    const frame = parseInt(parts[0], 10);
                    const keys = (parts.slice(1).join(",") || "").trim();
                    return {
                        frame,
                        keys: normalizeKeys(keys)
                    };
                }).filter(e => !isNaN(e.frame)).sort((a, b) => a.frame - b.frame);
            }

            function getStateAt(entries, frame) {
                let state = "";
                for (let i = 0; i < entries.length; i++) {
                    if (entries[i].frame <= frame) state = entries[i].keys;
                    else break;
                }
                return state;
            }

            function executeTasCommand(t) {
                if (!t || !(t = String(t).trim())) return false;
                // HOLD
                if (t.startsWith("hold")) {
                    let m = t.match(/^hold\s+([wasd]+)\s+for\s+(\d+)\s+at\s+(\d+)$/i);
                    if (!m) m = t.match(/^hold\s+([wasd]+)\s+(\d+)\s+(\d+)$/i);
                    if (!m) return false;
                    const heldKeys = normalizeKeys(m[1]);
                    const duration = parseInt(m[2], 10);
                    const start = parseInt(m[3], 10);
                    if (!heldKeys || isNaN(duration) || isNaN(start) || duration <= 0) return false;
                    const end = start + duration;
                    const existingText = $("decoded").value || "";
                    const entries = parseLines(existingText);
                    const baseMap = new Map(entries.map(e => [e.frame, e.keys]));
                    const updates = new Map();
                    const startBase = getStateAt(entries, start);
                    const startSet = new Set([...(startBase || "")]);
                    for (const k of heldKeys) startSet.add(k);
                    const startState = normalizeKeys(Array.from(startSet).join(""));
                    updates.set(start, startState);
                    for (const e of entries) {
                        if (e.frame > start && e.frame < end) {
                            const midSet = new Set([...(e.keys || "")]);
                            for (const k of heldKeys) midSet.add(k);
                            updates.set(e.frame, normalizeKeys(Array.from(midSet).join("")));
                        }
                    }
                    const endBase = getStateAt(entries, end);
                    updates.set(end, normalizeKeys(endBase));
                    const out = new Map(baseMap);
                    for (const [fr, ks] of updates.entries()) out.set(fr, ks);
                    const result = Array.from(out.entries()).sort((a, b) => a[0] - b[0]).map(([fr, ks]) => `${fr},${ks}`);
                    setHuman(result.join("\n"));
                    return true;
                }
                // TAP
                if (t.startsWith("tap ")) {
                    const e = t.split(/\s+/);
                    if (6 !== e.length) return false;
                    const n = e.map((t, e) => e > 0 && e !== 3 ? parseInt(t, 10) : t),
                        r = n[1],
                        a = n[2],
                        o = n[3],
                        s = n[4],
                        i = n[5];
                    if ([r, a, s, i].some(isNaN) || r >= a || s <= 0 || i <= 0) return false;
                    const l = $("decoded").value.split("\n").filter(t => "" !== t.trim());
                    let c = "";
                    let d = -1;
                    for (const u of l) {
                        const t = u.split(",");
                        if (2 === t.length) {
                            const e = parseInt(t[0], 10);
                            !isNaN(e) && e < r && e > d && (c = t[1].trim(), d = e);
                        }
                    }
                    const f = [];
                    let p = r;
                    for (; p <= a;) {
                        f.push(`${p},${o}`);
                        p += s;
                        if (p > a) break;
                        f.push(`${p},${c}`);
                        p += i;
                    }
                    const m = new Map;
                    l.forEach(t => {
                        const e = t.split(","),
                            n = parseInt(e[0], 10);
                        isNaN(n) || m.set(n, e[1] ? e[1].trim() : "")
                    });
                    f.forEach(t => {
                        const e = t.split(","),
                            n = parseInt(e[0], 10);
                        isNaN(n) || m.set(n, e[1] ? e[1].trim() : "")
                    });
                    const g = Array.from(m.entries()).sort((t, e) => t[0] - e[0]).map(([t, e]) => `${t},${e}`);
                    setHuman(g.join("\n"));
                    return true;
                }
                // SHIFT
                if (/^shift\s+/i.test(t)) {
                    let m = t.match(/^shift\s+(-?\d+)\s+from\s+(-?\d+)\s+to\s+(-?\d+)$/i);
                    let hasEnd = true;
                    if (!m) {
                        m = t.match(/^shift\s+(-?\d+)\s+from\s+(-?\d+)$/i);
                        hasEnd = false;
                    }
                    if (!m) return false;
                    const delta = parseInt(m[1], 10);
                    let start = parseInt(m[2], 10);
                    let end = hasEnd ? parseInt(m[3], 10) : null;
                    if (isNaN(delta) || isNaN(start) || (hasEnd && isNaN(end))) return false;
                    if (start < 0) start = 0;
                    if (hasEnd && end < 0) end = 0;
                    const ta = $("decoded");
                    if (!ta) return false;
                    const txt = ta.value || "";
                    const lines = txt.split("\n");
                    const out = lines.map(function(line) {
                        const mm = line.match(/^(\s*)(\d+)(\s*,[\s\S]*)$/);
                        if (!mm) return line;
                        const fr = parseInt(mm[2], 10);
                        if (isNaN(fr)) return line;
                        if (hasEnd) {
                            if (fr < start || fr > end) return line;
                        } else {
                            if (fr < start) return line;
                        }
                        let nf = fr + delta;
                        if (nf < 0) nf = 0;
                        return mm[1] + String(nf) + mm[3];
                    });
                    setHuman(out.join("\n"));
                    return true;
                }
                return false;
            }
            $("execute").onclick = function() {
                const t = $("command").value;
                executeTasCommand(t);
            };

            var decodedTa = $("decoded"),
                lastSel = {
                    start: 0,
                    end: 0
                };
            if (decodedTa) {
                function updateLastSel() {
                    try {
                        lastSel.start = decodedTa.selectionStart || 0;
                        lastSel.end = decodedTa.selectionEnd || 0;
                    } catch (e) {}
                }
                decodedTa.addEventListener('select', updateLastSel);
                decodedTa.addEventListener('keyup', updateLastSel);
                decodedTa.addEventListener('mouseup', updateLastSel);
                decodedTa.addEventListener('blur', updateLastSel);
            }

            document.getElementById("offset-apply").onclick = function() {
                const t = $("decoded");
                const e = $("offset-ms");
                if (!t || !e) return;
                const n = parseInt(e.value, 10);
                if (isNaN(n) || n === 0) return;
                let o = typeof t.selectionStart === 'number' ? t.selectionStart : lastSel.start;
                let a = typeof t.selectionEnd === 'number' ? t.selectionEnd : lastSel.end;
                if (o === a) return;
                const l = t.value;

                let s = l.lastIndexOf("\n", o - 1) + 1,
                    i = l.indexOf("\n", a);
                if (i === -1) i = l.length;
                const r = l.substring(0, s),
                    c = l.substring(i),
                    u = l.substring(s, i);
                const d = u.split("\n").map(t => {
                    if (t.trim() === "") return t;
                    const e = t.split(",");
                    if (e.length < 2) return t;
                    const o = parseInt(e[0], 10);
                    if (isNaN(o)) return t;
                    let a = o + n;
                    if (a < 0) a = 0;
                    const l = e.slice(1).join(",");
                    return `${a},${l}`;
                }).join("\n");

                setHuman(r + d + c);
                e.value = "";
                lastSel = {
                    start: 0,
                    end: 0
                };
            };

            (function() {
                var fb = $("findbar"),
                    f = $("find"),
                    cnt = $("find-count"),
                    ta = $("decoded");
                var state = {
                    idx: -1,
                    pos: []
                };

                function updateCount() {
                    if (!state.pos.length) {
                        cnt.textContent = "0 of 0";
                    } else {
                        cnt.textContent = (state.idx + 1) + " of " + state.pos.length;
                    }
                }

                function select(k) {

                            try {
                                selectInTextarea(l.lineOffset, 0);
                            } catch (e) {}
                        });
                        list.appendChild(div);
                    });
                }

                function open() {
                    overlay.style.display = 'flex';
                    render('');
                    setTimeout(function() {
                        try {
                            input.focus();
                            input.select();
                        } catch (e) {}
                    }, 0);
                }

                function close() {
                    overlay.style.display = 'none';
                }

                if (openBtn) openBtn.onclick = function() {
                    open();
                };
                input.addEventListener('input', function() {
                    render(input.value);
                });
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) close();
                });

                function addLabelAtCaret() {
                    try {
                        var label = prompt('Label text');
                        if (!label) return;
                        var ta = $("decoded");
                        var caret = typeof ta.selectionStart === 'number' ? ta.selectionStart : (window.lastSel && typeof lastSel.start === 'number' ? lastSel.start : 0);
                        var txt = ta.value || '';
                        var start = txt.lastIndexOf('\n', Math.max(0, caret - 1)) + 1;
                        var end = txt.indexOf('\n', caret);
                        if (end === -1) end = txt.length;
                        var before = txt.substring(0, start);
                        var after = txt.substring(end);
                        var line = txt.substring(start, end);
                        var hash = line.indexOf('#');
                        var code = hash >= 0 ? line.slice(0, hash).replace(/\s+$/, '') : line.replace(/\s+$/, '');
                        var newLine = code.length ? (code + ' # ' + label) : ('# ' + label);
                        setHuman(before + newLine + after);
                        try {
                            selectInTextarea(start, 0);
                        } catch (e) {}
                        render(input.value);
                    } catch (e) {}
                }

                function addLabelAtFrame() {
                    try {
                        var frameStr = prompt('Frame number');
                        if (!frameStr) return;
                        var fr = parseInt(frameStr, 10);
                        if (isNaN(fr)) return;
                        var label = prompt('Label text');
                        if (!label) return;
                        var ta = $("decoded");
                        var txt = ta.value || '';
                        var lines = txt.split('\n');
                        var offset = 0;
                        var found = false;
                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i];
                            var fc = line.split(',')[0].trim();
                            var n = parseInt(fc, 10);
                            if (!isNaN(n) && n === fr) {
                                var hash = line.indexOf('#');
                                var code = hash >= 0 ? line.slice(0, hash).replace(/\s+$/, '') : line.replace(/\s+$/, '');
                                var newLine = code.length ? (code + ' # ' + label) : ('# ' + label);
                                lines[i] = newLine;
                                found = true;
                                break;
                            }
                            offset += line.length + 1;
                        }
                        if (!found) {
                            alert('No line found for frame ' + fr + '.');
                            return;
                        }
                        setHuman(lines.join('\n'));
                        try {
                            selectInTextarea(offset, 0);
                        } catch (e) {}
                        render(input.value);
                    } catch (e) {}
                }

                $("bookmark-add-current").onclick = function() {
                    addLabelAtCaret();
                };
                $("bookmark-add-by-frame").onclick = function() {
                    addLabelAtFrame();
                };

                // Keyboard shortcuts
                window.addEventListener('keydown', function(e) {
                    var isMod = e.ctrlKey || e.metaKey;
                    if (isMod && !e.altKey && !e.shiftKey && (e.key === 'b' || e.key === 'B')) {
                        e.preventDefault();
                        open();
                    } else if (isMod && e.shiftKey && (e.key === 'b' || e.key === 'B')) {
                        e.preventDefault();
                        addLabelAtCaret();
                    } else if (overlay.style.display !== 'none' && e.key === 'Escape') {
                        e.preventDefault();
                        close();
                    }
                }, true);
            })();
        });

                    var out = [],
                        previous = "";
                    sorted.forEach(function(e) {
                        if (e.keys === previous) return;
                        out.push({
                            frame: e.frame,
                            keys: e.keys
                        });
                        previous = e.keys;
                    });
                    return out;
                }

                function countInputEvents(entries) {
                    return compactEntries(entries).length;
                }

                function makeCandidate(baseEntries, startFrame, holdFrames, keys) {
                    var endFrame = Math.max(startFrame + 1, startFrame + holdFrames);
                    var revert = stateAt(baseEntries, endFrame);
                    var map = new Map();
                    baseEntries.forEach(function(e) {
                        if (!(e.frame > startFrame && e.frame < endFrame)) map.set(e.frame, e.keys);
                    });
                    map.set(startFrame, normalizeKeys(keys));
                    map.set(endFrame, normalizeKeys(revert));
                    return entriesToText(Array.from(map.entries()).map(function(kv) {
                        return {
                            frame: kv[0],
                            keys: kv[1]
                        };
                    }));
                }

                function readInt(id, fallback, min, max) {
                    var n = parseInt(($(id) && $(id).value) || "", 10);
                    if (isNaN(n)) n = fallback;
                    if (typeof min === "number") n = Math.max(min, n);
                    if (typeof max === "number") n = Math.min(max, n);
                    return n;
                }

                function readFloat(id, fallback, min, max) {
                    var n = parseFloat((($(id) && $(id).value) || ""));
                    if (!Number.isFinite(n)) n = fallback;
                    if (typeof min === "number") n = Math.max(min, n);
                    if (typeof max === "number") n = Math.min(max, n);
                    return n;
                }

                function clampInt(n, fallback, min, max) {
                    n = parseInt(n, 10);
                    if (isNaN(n)) n = fallback;
                    if (typeof min === "number") n = Math.max(min, n);
                    if (typeof max === "number") n = Math.min(max, n);
                    return n;
                }

                function readIntRange(id, fallback, min, max) {
                    var raw = String((($(id) && $(id).value) || "")).trim().toLowerCase();
                    raw = raw.replace(/[–—]/g, "-").replace(/\s+to\s+/g, "-").replace(/\s*\.\.\s*/g, "-");
                    var m = raw.match(/^(\d+)\s*-\s*(\d+)$/);
                    if (m) {
                        var a = clampInt(m[1], fallback, min, max);
                        var b = clampInt(m[2], fallback, min, max);
                        if (b < a) {
                            var t = a;
                            a = b;
                            b = t;
                        }
                        return {
                            min: a,
                            max: b,
                            fixed: a === b,
                            label: a === b ? String(a) : (a + "-" + b)
                        };
                    }
                    var n = clampInt(raw, fallback, min, max);
                    return {
                        min: n,
                        max: n,
                        fixed: true,
                        label: String(n)
                    };
                }

                function rollInt(spec) {
                    if (!spec || spec.max <= spec.min) return spec ? spec.min : 0;
                    return spec.min + Math.floor(Math.random() * (spec.max - spec.min + 1));
                }

                function randomInt(min, max) {
                    min = Math.ceil(min);
                    max = Math.floor(max);
                    if (max <= min) return min;
                    return min + Math.floor(Math.random() * (max - min + 1));
                }

                function selectedLineFrame() {
                    try {
                        var ta = $("decoded");
                        if (!ta) return null;
                        var text = ta.value || "";
                        var start = text.lastIndexOf("\n", Math.max(0, ta.selectionStart - 1)) + 1;
                        var line = text.slice(start, text.indexOf("\n", start) === -1 ? text.length : text.indexOf("\n", start));
                        var n = parseInt(line.split(",")[0], 10);
                        return isNaN(n) ? null : n;
                    } catch (e) {
                        return null;
                    }
                }

                function bestSummary(best) {
                    if (!best) return "No best candidate yet.";
                    var st = best.state || {};
                    return (best.label || ("#" + best.index)) + " | score " + Number(best.score || 0).toFixed(3) + (best.selectionScore != null && Math.abs(Number(best.selectionScore) - Number(best.score || 0)) > 1e-9 ? (" | combined " + Number(best.selectionScore).toFixed(3)) : "") + (best.inputCount != null ? (" | inputs " + best.inputCount) : "") + " | cp " + (st.nextCheckpointIndex != null ? st.nextCheckpointIndex : "?") + " | speed " + (st.speedKmh != null ? Number(st.speedKmh).toFixed(2) : "?") + " km/h" + (st.distanceToTarget != null ? (" | target " + Number(st.distanceToTarget).toFixed(2) + " m") : "");
                }

                try {
                    var sf = selectedLineFrame();
                    if (sf != null && $("bf-start")) {
                        $("bf-start").value = String(sf);
                        if ($("bf-finish") && readInt("bf-finish", 0, 0) <= sf) $("bf-finish").value = String(sf + 30);
                    }
                } catch (e) {}

                var lastBest = null;
                var bfSession = null;

                function candidatesPerSecond(session, completed) {
                    if (!session || !session.startedAt) return 0;
                    var elapsedSeconds = Math.max(0.001, (performance.now() - session.startedAt) / 1000);
                    return Math.max(0, completed || 0) / elapsedSeconds;
                }

                function speedLine(session, completed) {
                    return "Candidates/s: " + candidatesPerSecond(session, completed).toFixed(1);
                }

                function shiftOneInputTiming(entries, session, blockedFrames) {
                    if (!entries.length || session.maxTimeDifference < 1) return null;
                    var eligible = [];
                    for (var i = 0; i < entries.length; i++) {
                        var item = entries[i];
                        if (item.frame < session.start || item.frame > session.finish) continue;
                        if (blockedFrames && blockedFrames.has(item.frame)) continue;
                        var previousFrame = i > 0 ? entries[i - 1].frame : -1;
                        var nextFrame = i + 1 < entries.length ? entries[i + 1].frame : Number.MAX_SAFE_INTEGER;
                        var low = Math.max(session.start, previousFrame + 1, item.frame - session.maxTimeDifference);
                        var high = Math.min(session.finish, nextFrame - 1, item.frame + session.maxTimeDifference);
                        if (low < item.frame || high > item.frame) eligible.push({
                            index: i,
                            low: low,
                            high: high
                        });
                    }
                    if (!eligible.length) return null;
                    for (var attempt = 0; attempt < Math.min(eligible.length * 2, 40); attempt++) {
                        var picked = eligible[randomInt(0, eligible.length - 1)];
                        var source = entries[picked.index];
                        var targetChoices = [];
                        for (var frame = picked.low; frame <= picked.high; frame++)
                            if (frame !== source.frame && (!blockedFrames || !blockedFrames.has(frame))) targetChoices.push(frame);
                        if (!targetChoices.length) continue;
                        var target = targetChoices[randomInt(0, targetChoices.length - 1)];
                        var shifted = entries.map(function(e) {
                            return {
                                frame: e.frame,
                                keys: e.keys
                            };
                        });
                        shifted[picked.index].frame = target;
                        shifted.sort(function(a, b) {
                            return a.frame - b.frame;
                        });
                        if (blockedFrames) {
                            blockedFrames.add(source.frame);
                            blockedFrames.add(target);
                        }
                        return {
                            text: entriesToText(shifted),
                            from: source.frame,
                            to: target,
                            difference: target - source.frame,
                            keys: source.keys
                        };
                    }
                    return null;
                }

                function buildMutant(session, baseText, candidateIndex) {
                    var workingText = baseText;
                    var workingEntries = parseEntries(workingText);
                    var stepUsed = rollInt(session.stepSpec);
                    var holdUsed = rollInt(session.holdSpec);
                    var changes = [];
                    var timingChanges = [];
                    var endFrame = session.finish;
                    var requestedChanges = randomInt(1, session.maxChangedInputs);
                    var timingOnly = session.mutationMode === "timing_only";
                    var inputOnly = session.mutationMode === "inputs_only";
                    var lisOnly = session.mutationMode === "lis";

                    if (lisOnly) {
                        var originalEntries = compactEntries(workingEntries);
                        var originalInputCount = countInputEvents(originalEntries);
                        var eligible = [];
                        for (var li = 0; li < originalEntries.length; li++) {
                            if (originalEntries[li].frame >= session.start && originalEntries[li].frame <= endFrame) eligible.push(li);
                        }
                        var removable = Math.min(requestedChanges, eligible.length, Math.max(0, originalEntries.length - 1));
                        var selected = new Set();
                        if (removable > 0 && eligible.length) selected.add(eligible[candidateIndex % eligible.length]);
                        while (selected.size < removable) selected.add(eligible[randomInt(0, eligible.length - 1)]);
                        var removed = Array.from(selected).sort(function(a, b) {
                            return b - a;
                        }).map(function(idx) {
                            return originalEntries[idx];
                        });
                        var lisEntries = originalEntries.map(function(e) {
                            return {
                                frame: e.frame,
                                keys: e.keys
                            };
                        });
                        Array.from(selected).sort(function(a, b) {
                            return b - a;
                        }).forEach(function(idx) {
                            lisEntries.splice(idx, 1);
                        });
                        lisEntries = compactEntries(lisEntries);
                        if (lisEntries.length && lisEntries.length < originalEntries.length) workingText = entriesToText(lisEntries);
                        var lisInputCount = countInputEvents(parseEntries(workingText));
                        var removedLabel = removed.slice().sort(function(a, b) {
                            return a.frame - b.frame;
                        }).map(function(e) {
                            return "f" + e.frame + ":" + (e.keys || "<none>");
                        }).join(" ");
                        return {
                            index: candidateIndex,
                            label: "LIS removed " + Math.max(0, originalInputCount - lisInputCount) + " event" + ((originalInputCount - lisInputCount) === 1 ? "" : "s") + " | inputs " + originalInputCount + "→" + lisInputCount + " | " + (removedLabel || "no valid removal"),
                            text: workingText,
                            frameStep: stepUsed,
                            hold: holdUsed,
                            changes: removed.map(function(e) {
                                return {
                                    frame: e.frame,
                                    keys: e.keys,
                                    type: "lis_remove"
                                };
                            }),
                            timingChanges: [],
                            inputCount: lisInputCount,
                            baseInputCount: originalInputCount
                        };
                    }

                    var timingTarget = timingOnly ? requestedChanges : ((!inputOnly && session.maxTimeDifference > 0) ? 1 : 0);
                    var inputTarget = timingOnly ? 0 : Math.max(0, requestedChanges - timingTarget);

                    // Preserve the previous exhaustive one-input search when timing mutation is disabled.
                    if (inputOnly && session.maxChangedInputs === 1 && session.stepSpec.fixed && session.holdSpec.fixed) {
                        var positionCount = Math.max(1, Math.floor((session.finish - session.start) / session.stepSpec.min) + 1);
                        var positionSlot = Math.floor(candidateIndex / session.keysets.length) % positionCount;
                        var frame = session.start + positionSlot * session.stepSpec.min;
                        var fixedKeys = session.keysets[candidateIndex % session.keysets.length];
                        workingText = makeCandidate(workingEntries, frame, holdUsed, fixedKeys);
                        changes.push({
                            frame: frame,
                            keys: fixedKeys,
                            type: "input"
                        });
                        inputTarget = 0;
                    }

                    if (inputTarget > 0) {
                        var possibleChanges = Math.max(1, Math.floor((session.finish - session.start) / Math.max(1, stepUsed)) + 1);
                        var changeCount = Math.min(inputTarget, possibleChanges);
                        var span = (changeCount - 1) * stepUsed;
                        var maxAnchor = Math.max(session.start, endFrame - span);
                        var anchor = randomInt(session.start, maxAnchor);
                        for (var j = 0; j < changeCount; j++) {
                            var changeFrame = Math.min(endFrame, anchor + j * stepUsed);
                            var currentState = stateAt(workingEntries, changeFrame);
                            var alternatives = session.keysets.filter(function(k) {
                                return k !== currentState;
                            });
                            var pool = alternatives.length ? alternatives : session.keysets;
                            var keys = pool[randomInt(0, pool.length - 1)];
                            workingText = makeCandidate(workingEntries, changeFrame, holdUsed, keys);
                            workingEntries = parseEntries(workingText);
                            changes.push({
                                frame: changeFrame,
                                keys: keys,
                                type: "input"
                            });
                        }
                    }

                    var blockedFrames = new Set();
                    for (var k = 0; k < timingTarget; k++) {
                        workingEntries = parseEntries(workingText);
                        var shifted = shiftOneInputTiming(workingEntries, session, blockedFrames);
                        if (!shifted) break;
                        workingText = shifted.text;
                        timingChanges.push(shifted);
                        changes.push({
                            frame: shifted.to,
                            keys: shifted.keys,
                            type: "timing",
                            from: shifted.from,
                            difference: shifted.difference
                        });
                    }

                    // In mixed mode, if no timing event could move, fill the unused slot with a normal input mutation.
                    if (!timingOnly && !inputOnly && timingTarget > 0 && timingChanges.length === 0 && session.keysets.length) {
                        workingEntries = parseEntries(workingText);
                        var fallbackFrame = randomInt(session.start, endFrame);
                        var fallbackState = stateAt(workingEntries, fallbackFrame);
                        var fallbackPool = session.keysets.filter(function(k) {
                            return k !== fallbackState;
                        });
                        if (!fallbackPool.length) fallbackPool = session.keysets;
                        var fallbackKeys = fallbackPool[randomInt(0, fallbackPool.length - 1)];
                        workingText = makeCandidate(workingEntries, fallbackFrame, holdUsed, fallbackKeys);
                        changes.push({
                            frame: fallbackFrame,
                            keys: fallbackKeys,
                            type: "input"
                        });
                    }

                    var compact = changes.map(function(c) {
                        if (c.type === "timing") return "f" + c.from + "→" + c.frame + "(" + (c.difference > 0 ? "+" : "") + c.difference + "):" + (c.keys || "<none>");
                        return "f" + c.frame + ":" + (c.keys || "<none>");
                    }).join(" ");
                    var modeLabel = timingOnly ? "timing only" : (inputOnly ? "inputs only" : "mixed");
                    return {
                        index: candidateIndex,
                        label: changes.length + " change" + (changes.length === 1 ? "" : "s") + " | " + modeLabel + " | step" + stepUsed + " hold" + holdUsed + " | " + (compact || "no valid mutation"),
                        text: workingText,
                        frameStep: stepUsed,
                        hold: holdUsed,
                        changes: changes,
                        timingChanges: timingChanges,
                        inputCount: countInputEvents(parseEntries(workingText))
                    };
                }

                function finishSession(message) {
                    if (!bfSession) return;
                    bfSession.running = false;
                    lastBest = bfSession.currentBest || lastBest;
                    applyBestBtn.disabled = !(lastBest && lastBest.text);
                    var finalText = message || ("Stopped. Tested " + bfSession.tested + " candidates across " + bfSession.round + " rolling waves.\nImprovements accepted: " + bfSession.improvements + "\nBest: " + bestSummary(lastBest) + "\nClick Apply Best to copy it into the editor, then Apply to send it to the selected ghost.");
                    status.textContent = finalText + "\n" + speedLine(bfSession, bfSession.tested);
                }

                function sendNextWave() {
                    var session = bfSession;
                    if (!session || !session.running) return;
                    if (session.cancelled) {
                        finishSession("Bruteforce cancelled after " + session.tested + " candidates.\nBest retained: " + bestSummary(session.currentBest));
                        return;
                    }
                    var waveSize = session.batchSize;
                    var baselineIndex = -1000000 - session.round;
                    var candidates = [{
                        index: baselineIndex,
                        label: session.round === 0 ? "Original TAS baseline" : "Current rolling best baseline",
                        text: session.currentBaseText,
                        inputCount: countInputEvents(parseEntries(session.currentBaseText))
                    }];
                    for (var i = 0; i < waveSize; i++) {
                        candidates.push(buildMutant(session, session.currentBaseText, session.nextCandidateIndex++));
                    }

                    session.currentWaveSize = waveSize;
                    session.baselineIndex = baselineIndex;
                    session.activeRunId = null;
                    session.round++;
                    status.textContent = "Rolling wave " + session.round + ": testing " + waveSize + " new candidates from the current best.\nTotal tested: " + session.tested + " (runs until Cancel).\n" + speedLine(session, session.tested) + "\nCurrent best: " + bestSummary(session.currentBest);
                    window.electron.tasToolBruteforceRun({
                        baseText: session.currentBaseText,
                        candidates: candidates,
                        evalFrame: session.evalFrame,
                        objective: session.objective,
                        lisMode: session.mutationMode === "lis",
                        lisWeight: session.lisWeight,
                        distanceWeight: session.distanceWeight,
                        targetPoint: session.targetPoint,
                        baselineIndex: baselineIndex,
                        concurrency: Math.min(session.batchSize, candidates.length)
                    });
                }

                runBtn.addEventListener("click", function() {
                    try {

                        if (!baseEntries.length) {
                            status.textContent = "No decoded TAS lines to mutate.";

                        }
                        var start = readInt("bf-start", 0, 0);
                        var finish = readInt("bf-finish", start + 30, 0, 999999);
                        if (finish < start) {
                            status.textContent = "Finish search must be the same as or later than Start frame.";
                            return;
                        }
                        var stepSpec = readIntRange("bf-step", 1, 1, 100000);
                        var holdSpec = readIntRange("bf-hold", 8, 1, 100000);
                        var maxChangedInputs = readInt("bf-max-changes", 1, 1, 100);
                        var maxTimeDifference = readInt("bf-max-time-diff", 5, 0, 100000);
                        var mutationMode = ($("bf-mutation-mode") && $("bf-mutation-mode").value) || "inputs_timing";
                        var evalFrame = readInt("bf-eval", finish + holdSpec.max + maxTimeDifference + 60, 1, 999999);
                        var batchSize = readInt("bf-concurrency", 48, 1, 128);
                        var distanceWeight = readInt("bf-distance-weight", 50, 0, 100) / 100;
                        var lisWeight = readInt("bf-lis-weight", 50, 0, 100) / 100;
                        var targetPoint = {
                            x: readFloat("bf-target-x", 0),
                            y: readFloat("bf-target-y", 0),
                            z: readFloat("bf-target-z", 0)

                        var keysets = String(($("bf-keysets") && $("bf-keysets").value) || "").split(",").map(function(k) {

                        var seen = new Set(),
                            unique = [];

                            if (!seen.has(k)) {
                                seen.add(k);
                                unique.push(k);
                            }

                            status.textContent = "Add at least one keyset for an input-changing mode.";
                            return;
                        }
                        if (mutationMode === "timing_only" && maxTimeDifference < 1) {
                            status.textContent = "Timing-only mode requires Max time difference to be at least 1.";
                            return;
                        }

                        bfSession = {
                            running: true,
                            cancelled: false,
                            currentBaseText: text,
                            currentBest: null,
                            currentBestScore: null,
                            currentBestInputCount: null,
                            startedAt: performance.now(),
                            tested: 0,
                            improvements: 0,
                            round: 0,
                            nextCandidateIndex: 0,
                            activeRunId: null,
                            currentWaveSize: 0,
                            baselineIndex: null,
                            start: start,
                            finish: finish,
                            stepSpec: stepSpec,
                            holdSpec: holdSpec,
                            maxChangedInputs: maxChangedInputs,
                            maxTimeDifference: maxTimeDifference,
                            mutationMode: mutationMode,
                            evalFrame: evalFrame,
                            batchSize: batchSize,
                            keysets: unique,
                            objective: ($("bf-objective") && $("bf-objective").value) || "checkpoint_speed",
                            distanceWeight: distanceWeight,
                            lisWeight: lisWeight,
                            targetPoint: targetPoint

                        });
                    } catch (e) {}
                });
                driveDiscardBtn.addEventListener("click", function() {
                    try {
                        driveReadout.textContent = "Stopping and discarding this continuation attempt…";
                        window.electron.tasToolDriveStop({
                            commit: false
                        });
                    } catch (e) {}
                });
                if (window.electron && window.electron.onTasToolDriveStatus) {
                    window.electron.onTasToolDriveStatus(function(info) {
                        info = info || {};
                        if (info.status === "starting") driveReadout.textContent = "Sending drive mode to the replay screen for frame " + (info.takeoverFrame != null ? info.takeoverFrame : "…") + "…";
                        else if (info.status === "restarting") {
                            driveStartBtn.disabled = true;
                            driveStopBtn.disabled = false;
                            driveDiscardBtn.disabled = false;
                            driveReadout.textContent = "Restarting from the TAS endpoint…";
                        } else if (info.status === "received") driveReadout.textContent = "Replay screen received drive mode. Preparing the simulation…";
                        else if (info.status === "preroll") driveReadout.textContent = "Fast-forwarding to frame " + (info.takeoverFrame != null ? info.takeoverFrame : "…") + "… the game window has keyboard focus.";
                        else if (info.status === "driving") {
                            driveStartBtn.disabled = true;
                            driveStopBtn.disabled = false;
                            driveDiscardBtn.disabled = false;
                            driveReadout.textContent = "Driving at " + Math.round((Number(info.rate) || Number(driveSpeed.value) / 100) * 100) + "% — " + driveHotkeyText() + " from the TAS endpoint.";
                        } else if (info.status === "rate") {
                            driveReadout.textContent = "Driving at " + Math.round((Number(info.rate) || Number(driveSpeed.value) / 100) * 100) + "% — " + driveHotkeyText() + " from the TAS endpoint.";
                        } else if (info.status === "stopped") {
                            driveStartBtn.disabled = false;
                            driveStopBtn.disabled = true;
                            driveDiscardBtn.disabled = true;
                            if (info.text) setHuman(info.text);
                            driveReadout.textContent = "Continuation inputs kept in the editor through frame " + (info.frames != null ? info.frames : "…") + ".";
                        } else if (info.status === "aborted") {
                            driveStartBtn.disabled = false;
                            driveStopBtn.disabled = true;
                            driveDiscardBtn.disabled = true;
                            driveReadout.textContent = "Continuation stopped and the recorded attempt was discarded.";
                        } else if (info.status === "error") {
                            driveStartBtn.disabled = false;
                            driveStopBtn.disabled = true;
                            driveDiscardBtn.disabled = true;
                            driveReadout.textContent = "Drive mode error" + (info.stage ? " [" + info.stage + "]" : "") + ": " + (info.message || "unknown error");
                        }
                    });
                }

                if (window.electron && window.electron.onTasToolBruteforceProgress) {
                    window.electron.onTasToolBruteforceProgress(function(p) {
                        try {
                            if (!p) return;
                            var session = bfSession;
                            if (!session || !session.running) return;
                            if (p.runId && !session.activeRunId) session.activeRunId = p.runId;
                            if (p.runId && session.activeRunId && p.runId !== session.activeRunId) return;
                            var waveDone = Math.max(0, (typeof p.done === "number" ? p.done : 0) - 1);
                            waveDone = Math.min(session.currentWaveSize, waveDone);
                            var overallDone = session.tested + waveDone;
                            var msg = "Rolling wave " + session.round + ": simulated " + waveDone + "/" + session.currentWaveSize + " new candidates.\nTotal tested: " + overallDone + " (runs until Cancel).\n" + speedLine(session, overallDone);
                            if (p.best) msg += "\nWave leader: " + bestSummary(p.best);
                            if (session.currentBest) msg += "\nAccepted rolling best: " + bestSummary(session.currentBest);
                            status.textContent = msg;
                        } catch (e) {}
                    });
                }
                if (window.electron && window.electron.onTasToolBruteforceResult) {
                    window.electron.onTasToolBruteforceResult(function(p) {
                        try {
                            if (!p) return;
                            var session = bfSession;
                            if (!session || !session.running) return;
                            if (p.runId && session.activeRunId && p.runId !== session.activeRunId) return;
                            if (p.status === "error") {
                                finishSession("Bruteforce error: " + (p.message || "unknown error"));
                                return;
                            }
                            if (p.status === "cancelled") {
                                finishSession("Bruteforce cancelled after " + session.tested + " candidates.\nBest retained: " + bestSummary(session.currentBest));
                                return;
                            }

                            session.tested += session.currentWaveSize;
                            var roundBest = p.best || null;
                            if (roundBest && roundBest.text) {
                                var isMutation = roundBest.index !== session.baselineIndex;
                                var roundInputCount = roundBest.inputCount != null ? Number(roundBest.inputCount) : countInputEvents(parseEntries(roundBest.text));
                                roundBest.inputCount = roundInputCount;
                                if (!session.currentBest) {
                                    session.currentBest = roundBest;
                                    session.currentBaseText = roundBest.text;
                                    session.currentBestScore = Number(roundBest.score || 0);
                                    session.currentBestInputCount = roundInputCount;
                                    if (isMutation && p.improvesBaseline !== false) session.improvements++;
                                } else if (isMutation && p.improvesBaseline === true) {
                                    session.currentBest = roundBest;
                                    session.currentBaseText = roundBest.text;
                                    session.currentBestScore = Number(roundBest.score || 0);
                                    session.currentBestInputCount = roundInputCount;
                                    session.improvements++;
                                }
                            }
                            lastBest = session.currentBest || lastBest;
                            applyBestBtn.disabled = !(lastBest && lastBest.text);

                            if (session.cancelled) {
                                finishSession("Bruteforce cancelled after " + session.tested + " candidates.\nBest retained: " + bestSummary(session.currentBest));
                                return;
                            }
                            status.textContent = "Wave " + session.round + " complete. Remaining candidates will now mutate the newest accepted best.\nTotal tested: " + session.tested + " (runs until Cancel).\n" + speedLine(session, session.tested) + "\nAccepted best: " + bestSummary(session.currentBest);
                            setTimeout(sendNextWave, 0);
                        } catch (e) {
                            finishSession("Bruteforce result handling failed: " + (e && e.message ? e.message : e));
                        }
                    });
                }
            } catch (e) {}
        });
    </script>
